<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>برقية فصل (جندي - جندي أول)</title>
<link rel="icon" type="image/png" href="https://i.postimg.cc/28B0910P/snapedit-1754626983902.png">
<style>
  body {
    background-color: #0b132b;
    color: #fff;
    font-family: "Cairo", sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    position: relative;
    overflow: hidden;
    min-height: 100vh !important;
    overflow-y: auto !important;
  }

  body::before {
    content: "";
    position: fixed;
    top: 0%;
    left: -4%;
    width: 100%;
    height: 100%;
    background: url(https://i.postimg.cc/2585wyj6/Chat-GPT-Image-21-2026-11-00-56.png) no-repeat;
    background-size: 50%;
    background-position: left top;
    opacity: 0.08;
    z-index: 0;
  }

  body::after {
    content: "";
    position: fixed;
    top: 11%;
    right: -4%;
    width: 100%;
    height: 100%;
    background: url(https://i.postimg.cc/FKJBwgHW/Chat-GPT-Image-21-2026-08-52-13.png) no-repeat;
    background-size: 50%;
    background-position: right top;
    opacity: 0.08;
    z-index: 0;
  }

  .container {
    background: #1c2541;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 0 15px rgba(255,255,255,0.1);
    width: 380px;
    position: relative;
    z-index: 1;
    max-height: 90vh;
    overflow-y: auto;
    opacity: 0;
    transform: translateY(20px);
    animation: fadeIn 0.9s ease forwards;
  }

  @keyframes fadeIn {
    to { opacity: 1; transform: translateY(0); }
  }

  h2 {
    color: #5bc0be;
    text-align: center;
    margin-bottom: 20px;
  }

  label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
    text-align: right;
  }

  input, select {
    width: 100%;
    box-sizing: border-box;
    margin-top: 5px;
    padding: 10px;
    border-radius: 10px;
    border: 2px solid transparent;
    background: #3a506b;
    color: white;
    font-family: "Cairo", sans-serif;
    text-align: center;
    transition: 0.3s ease;
  }

  input:focus, select:focus {
    outline: none;
    border-color: #5bc0be;
    box-shadow: 0 0 10px #5bc0be80;
  }

  .buttons {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    margin-top: 25px;
  }

  button {
    width: 100%;
    background: #5bc0be;
    color: #000;
    border: none;
    padding: 10px;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s ease;
  }

  button:hover {
    background: #a1dfd5;
    transform: scale(1.03);
  }

  textarea {
    display: none;
  }

  ::-webkit-scrollbar {
    width: 10px;
  }
  ::-webkit-scrollbar-track {
    background: #1c2541;
    border-radius: 10px;
  }
  ::-webkit-scrollbar-thumb {
    background: #5bc0be;
    border-radius: 10px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: #a1dfd5;
  }

  @media (max-width: 768px) {
    body::before, body::after { display: none; }
    .container {
      width: 90%;
      padding: 25px;
    }
    ::-webkit-scrollbar { display: none; }
  }
</style>
</head>
<body>

<div class="container">
  <h2>برقية فصل (جندي - جندي أول)</h2>

  <label>الرتبة:</label>
  <select id="rank">
    <option value="جندي">جندي</option>
    <option value="جندي أول">جندي أول</option>
  </select>

  <label>ايدي العسكري:</label>
  <input type="text" id="soldierId" placeholder="مثال : 713958915850633307">

  <label>اسم العسكري:</label>
  <input type="text" id="soldierName" placeholder="مثال : زياد الحربي">

  <label>كود العسكري:</label>
  <input type="text" id="soldierCode" placeholder="مثال : 674">

  <div class="buttons">
    <button onclick="copyBanner()">📋 نسخ البانر</button>
    <button onclick="generateMessage()">📜 نسخ البرقية</button>
  </div>

  <textarea id="output" readonly></textarea>
</div>

<script>
function getRankMention(rank) {
  const ranks = {
    "جندي": "استقالة برتبة جندي",
    "جندي أول": "استقالة برتبة جندي أول"
  };
  return ranks[rank] || "";
}

function copyBanner() {
  navigator.clipboard.writeText("https://cdn.discordapp.com/attachments/1371992215076999421/1513506216884699298/2.gif");
}

function generateMessage() {
  const id = document.getElementById("soldierId").value || "xxxxxx";
  const name = document.getElementById("soldierName").value || "الاسم غير محدد";
  const code = document.getElementById("soldierCode").value || "000";
  const rank = document.getElementById("rank").value;
  const reason = getRankMention(rank);

  const msg = `**﷽**

**  قرار حكم صادر من :**

<@&1071933312588857395> 

** على العسكري المذكور أدناه :**  

<@${id}>       

**[P-${code}] ${name}**

** وبعد ماتم مناقشته مع المجلس العسكري والقُضاه فقد تقرر على المُدين اعلاه بالحكم :**

**الحكم :**

**\`فصل من السلك العسكري + منع توظيف 14 يوم + غرامة مليون\`**

**السبب :**

**\`${reason}\` ** 

**ترسل نسخة لـ** <@&1071933319362654329>  

**رئاسة الشرطة العسكرية ** 

<@1147884827966714010>  

<@929874150829465600>

<@&1071933293865480192> 

<@1098355352514330765> 

<@&1071933294473662505> 

<@697432773639536661>`;

  navigator.clipboard.writeText(msg);
}
</script>

</body>
</html>
