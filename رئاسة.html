<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>حكم عسكري </title>
<link rel="icon" type="image/png" href="https://i.postimg.cc/28B0910P/snapedit-1754626983902.png">
<style>
  body {
    background-color: #0b132b;
    color: #fff;
    font-family: "Cairo", sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    position: relative;
    overflow: hidden;
    min-height: 100vh !important;
    overflow-y: auto !important;
  }

  body::before {
    content: "";
    position: fixed;
    top: 0%;
    left: -4%;
    width: 100%;
    height: 100%;
    background: url(https://i.postimg.cc/2585wyj6/Chat-GPT-Image-21-2026-11-00-56.png) no-repeat;
    background-size: 50%;
    background-position: left top;
    opacity: 0.08;
    z-index: 0;
  }

  body::after {
    content: "";
    position: fixed;
    top: 11%;
    right: -4%;
    width: 100%;
    height: 100%;
    background: url(https://i.postimg.cc/FKJBwgHW/Chat-GPT-Image-21-2026-08-52-13.png) no-repeat;
    background-size: 50%;
    background-position: right top;
    opacity: 0.08;
    z-index: 0;
  }

  .container {
    background: #1c2541;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 0 15px rgba(255,255,255,0.1);
    width: 380px;
    position: relative;
    z-index: 1;
    max-height: 90vh;
    overflow-y: auto;
    opacity: 0;
    transform: translateY(20px);
    animation: fadeIn 0.9s ease forwards;
  }

  @keyframes fadeIn {
    to { opacity: 1; transform: translateY(0); }
  }

  h2 {
    color: #5bc0be;
    text-align: center;
    margin-bottom: 20px;
  }

  label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
    text-align: right;
  }

  input, select {
    width: 100%;
    box-sizing: border-box;
    margin-top: 5px;
    padding: 10px;
    border-radius: 10px;
    border: 2px solid transparent;
    background: #3a506b;
    color: white;
    font-family: "Cairo", sans-serif;
    text-align: center;
    transition: 0.3s ease;
  }

  input:focus {
    outline: none;
    border-color: #5bc0be;
    box-shadow: 0 0 10px #5bc0be80;
  }

  .inline-fields {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  
  .inline-fields input[type="text"],
  .inline-fields input[type="number"],
  .inline-fields select {
    flex: 1;
    margin-top: 5px;
  }
  .plus-sign {
    font-weight: bold;
    color: #5bc0be;
    padding: 0 5px;
    display: inline-block;
  }

  .dropdown {
    position: relative;
  }

  #reason {
    width: 100%;
    margin-top: 5px;
    padding: 10px;
    border-radius: 10px;
    border: 2px solid transparent;
    background: #3a506b;
    color: white;
    text-align: center;
    transition: 0.3s ease;
  }

  #reason:focus {
    outline: none;
    border-color: #5bc0be;
    box-shadow: 0 0 10px #5bc0be80;
  }

  .suggestions {
    display: none;
    position: absolute;
    top: 100%;
    width: 100%;
    background: #1c2541;
    border-radius: 10px;
    border: 1px solid #5bc0be40;
    margin-top: 5px;
    max-height: 160px;
    overflow-y: auto;
    z-index: 10;
  }

  .suggestions.active {
    display: block;
  }

  .group-title {
    color: #5bc0be;
    font-weight: bold;
    padding: 6px 10px;
    border-bottom: 1px solid #5bc0be40;
    background: #243b55;
  }

  .suggestion {
    padding: 8px 10px;
    cursor: pointer;
    transition: 0.2s;
    text-align: right;
  }

  .suggestion:hover {
    background: #5bc0be;
    color: #000;
  }

  button {
    width: 100%;
    background: #5bc0be;
    color: #000;
    border: none;
    padding: 10px;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s ease;
    margin-top: 15px;
  }

  button:hover {
    background: #a1dfd5;
    transform: scale(1.03);
  }

  ::-webkit-scrollbar {
    width: 8px;
  }
  ::-webkit-scrollbar-track {
    background: #1c2541;
  }
  ::-webkit-scrollbar-thumb {
    background: #5bc0be;
    border-radius: 10px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: #a1dfd5;
  }

#warningType {
  flex: 2.2; 
}

#fineValue {
  flex: 0.7; 
}

#fineUnit {
  flex: 0.8; 
}

.inline-fields {
  gap: 6px; 
}

</style>
</head>
<body>

<div class="container">
  <h2>حكم عسكري ( الرئاسة )</h2>

  <label>ايدي العسكري:</label>
  <input type="text" id="soldierId" placeholder="مثال : 1040328218319794186">

  <label> العسكري:</label>
  <select id="soldierType">
    <option value="فرد">فرد</option>
    <option value="ضابط">ضابط</option>
  </select>

  <label>الحكم:</label>
  <div class="inline-fields">
    <input type="text" id="warningType" placeholder="اكتب الحكم أو اختر من القائمة" list="warningList">
    <datalist id="warningList">
      <option value="إنذار شفهي أول">
      <option value="إنذار شفهي ثاني">
      <option value="إنذار شفهي أخير">
      <option value="إنذار وظيفي أول">
      <option value="إنذار وظيفي ثاني">
      <option value="إنذار وظيفي ثالث">
    </datalist>

    <span class="plus-sign" id="plusSign">+</span>

    <input type="text" id="fineValue" placeholder="القيمة" min="0" style="max-width:110px;">
    <select id="fineUnit" style="max-width:110px;">
      <option value="ألف">ألف</option>
      <option value="مليون">مليون</option>
    </select>
  </div>

  <label>السبب:</label>
  <div class="dropdown">
    <input type="text" id="reason" placeholder="ابحث أو اكتب السبب">
    <div class="suggestions" id="suggestions"></div>
  </div>
  <button onclick="copyBanner()">📜 نسخ البانر</button>
  <button onclick="generateMessage()">📋 نسخ البرقية</button>
</div>

  "المخالفات الثابتة": [

};

const input = document.getElementById("reason");
const suggestionsBox = document.getElementById("suggestions");

input.addEventListener("focus", () => {
  renderSuggestions("");
  suggestionsBox.classList.add("active");
});
input.addEventListener("input", () => {
  renderSuggestions(input.value.trim());
});

function renderSuggestions(q) {
  suggestionsBox.innerHTML = "";
  const query = (q || "").toLowerCase();
  let foundAny = false;
  for (const group in reasons) {
    const arr = reasons[group].filter(item => item.toLowerCase().includes(query));
    if (arr.length) {
      foundAny = true;
      const title = document.createElement("div");
      title.className = "group-title";
      title.textContent = group;
      suggestionsBox.appendChild(title);

      arr.forEach(text => {
        const div = document.createElement("div");
        div.className = "suggestion";
        div.textContent = text;
        div.onclick = () => {
          input.value = text;
          suggestionsBox.classList.remove("active");
        };
        suggestionsBox.appendChild(div);
      });
    }
  }
  if (foundAny) suggestionsBox.classList.add("active");
  else suggestionsBox.classList.remove("active");
}

document.addEventListener("click", (e) => {
  if (!document.querySelector(".dropdown").contains(e.target)) {
    suggestionsBox.classList.remove("active");
  }
});

function copyBanner() {
  navigator.clipboard.writeText("https://i.postimg.cc/2SVjRqXV/1.gif");

}

function generateMessage() {
  const id = document.getElementById("soldierId").value || "xxxxxx";
  const reason = document.getElementById("reason").value || "غير محدد";
  const type = document.getElementById("soldierType").value;

  const warn = document.getElementById("warningType").value.trim();
  const fineVal = document.getElementById("fineValue").value.trim();
  const fineUnit = document.getElementById("fineUnit").value;

  let delayText = "";
  if (warn.includes("وظيفي")) {
    if (type === "فرد") {
      if (warn.includes("ثاني")) delayText = " + تأخير ترقية 7 أيام";
      if (warn.includes("ثالث")) delayText = " + تأخير ترقية 14 يوم";
    } else if (type === "ضابط") {
      if (warn.includes("أول")) delayText = " + تأخير ترقية 7 أيام";
      if (warn.includes("ثاني")) delayText = " + تأخير ترقية 14 يوم";
      if (warn.includes("ثالث")) delayText = " + تأخير ترقية 21 يوم";
    }
  }

  const parts = [];
  if (warn) parts.push(warn);
  if (fineVal) parts.push(`غرامة ${fineVal} ${fineUnit}`);
  if (delayText) {
    parts.push(delayText.replace(/^ \+ /, ""));
  }

  const finalJudgment = parts.length ? parts.join(' + ') : "غير محدد";

  const msg = `**﷽**

**  قرار حكم صادر من رئاسة الشرطة العسكرية :**

<@&1071933312588857395>  

** على العسكري المذكور أدناه :**

<@${id}>  

 ** وبعد ماتم مناقشته مع رئاسة الشرطة العسكرية فقد تقرر على المُدين اعلاه بالحكم**
 
**الحكم :**

** \`${finalJudgment}\`  **
 
**السبب :**

** \`${reason}\`  **

**ترسل نسخة لـ** <@&1071933319362654329> 

**رئاسة الشرطة العسكرية  ** 

<@1147884827966714010> 

<@929874150829465600>       

<@&1071933293865480192> 

<@1098355352514330765> 

<@&1071933294473662505> 

<@697432773639536661>`;

  navigator.clipboard.writeText(msg);
}
</script>

</html>
