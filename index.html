<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الشؤون العسكرية</title>
<link rel="icon" type="image/png" href="https://i.postimg.cc/28B0910P/snapedit-1754626983902.png">

<style>
  body {
    background-color: #0b132b;
    color: #fff;
    font-family: "Cairo", sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh !important;
    margin: 0;
    overflow: hidden;
    position: relative;
  }

  body::before {
    content: "";
    position: fixed;
    top: 11%;
    left: -4%;
    width: 75%;
    height: 100%;
    background: url(https://i.postimg.cc/sgqktMqH/111.png) no-repeat;
    background-size: 40%;
    background-position: left top;
    opacity: 0.08;
    z-index: 0;
  }

  body::after {
    content: "";
    position: fixed;
    top: 11%;
    right: -4%;
    width: 100%;
    height: 100%;
    background: url(https://i.postimg.cc/FKJBwgHW/Chat-GPT-Image-21-2026-08-52-13.png) no-repeat;
    background-size: 50%;
    background-position: right top;
    opacity: 0.08;
    z-index: 0;
  }

  .container {
    background: #1c2541;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 0 15px rgba(255,255,255,0.1);
    width: 380px;
    position: relative;
    z-index: 1;
    max-height: 90vh;
    overflow-y: auto;
    text-align: center;
    opacity: 0;
    transform: translateY(20px);
    animation: fadeIn 0.9s ease forwards;
  }

  @keyframes fadeIn {
    to { opacity: 1; transform: translateY(0); }
  }

  h1 {
    color: #5bc0be;
    margin-bottom: 25px;
    font-size: 28px;
  }

  .btn {
    display: block;
    background: #2984a0;
    color: #0f0c0e;
    text-decoration: none;
    padding: 12px;
    border-radius: 12px;
    margin: 10px 0;
    font-weight: bold;
    transition: 0.3s ease;
  }

  .btn:hover {
    background: #a1dfd5;
    transform: scale(1.05);
  }

  footer {
    margin-top: 25px;
    font-size: 13px;
    opacity: 0.8;
  }

  ::-webkit-scrollbar {
    width: 10px;
  }

  ::-webkit-scrollbar-track {
    background: #1c2541;
    border-radius: 10px;
  }

  ::-webkit-scrollbar-thumb {
    background: #5bc0be;
    border-radius: 10px;
  }

  ::-webkit-scrollbar-thumb:hover {
    background: #a1dfd5;
  }

  @media (max-width: 768px) {
    body::before, body::after {
      display: none;
    }

    .container {
      width: 90%;
      padding: 25px;
    }

    ::-webkit-scrollbar {
      display: none;
    }
  }
</style>
</head>

<body>

<div class="container">
  <h1>الشؤون العسكرية</h1>

  <!-- بالترتيب المطلوب -->
  <a href="الاستدعاء.html" class="btn">📢 استدعاء</a>
  <a href="ملف.html" class="btn">📂 ملف التحقيق</a>
  <a href="قضاء.html" class="btn">⚖️ حكم عسكري (مجلس القضاء )</a>
  <a href="مسؤولين.html" class="btn">⚖️ حكم عسكري (المسؤولين )</a>
  <a href="رئاسة.html" class="btn">⚖️ حكم عسكري (الرئاسة )</a>
  <a href="تقارير.html" class="btn">📝 تقارير الشؤون العسكرية</a>
  <a href="اسقاط.html" class="btn">🔽 إسقاط حكم عسكري</a>

  <footer>الشؤون العسكرية التابعة لقطاع إدارة الـشـرطـة بمقاطعة بوليتو © 2026</footer>
</div>

</body>
</html>
